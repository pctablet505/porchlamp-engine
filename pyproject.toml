[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvi"
version = "0.1.0"
description = "Contributor Value Index (CVI) ranking engine"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["cvi", "cvi.pillars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
