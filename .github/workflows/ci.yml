name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "fastapi==0.141.1" "httpx==0.28.1" "ruff==0.16.7"

      - name: Lint (gate 1, ratchet: must stay clean)
        run: ruff check cvi/ scripts/ tests/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend Node test suite
        run: node --test web/v2/tests/unit.test.mjs web/v2/tests/render.perf.test.mjs

      - name: Run test suite
        run: env -u PYTEST_ADDOPTS python -m pytest tests/ -n auto -p no:cacheprovider

      - name: Anchors, sensitivity, reproduce (fixture snapshot)
        run: >
          env -u PYTEST_ADDOPTS python -m pytest
          tests/audit/test_anchors_fixture.py
          tests/audit/test_sensitivity_fixture.py
          tests/snapshot/test_reproduce_fixture.py
          -p no:cacheprovider

  package:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Show dist output
        run: ls -l dist/

      - name: sdist contains the store migrations
        run: tar tzf dist/*.tar.gz | grep -q 'cvi/store/migrations/.*\.sql'

      - name: Non-editable install (W4-1: package move must survive a real install)
        run: |
          python -m venv /tmp/cvi-install-check
          /tmp/cvi-install-check/bin/pip install --quiet "$(ls dist/*.tar.gz)[server]"

      - name: Non-editable install finds the moved/serving modules + migrations
        run: |
          /tmp/cvi-install-check/bin/python -c "
          import os
          import cvi
          import cvi.serve.app
          import cvi.snapshot.store_cmd
          import cvi.collect.ratelimit
          import cvi.store.migrations as m
          mdir = os.path.dirname(m.__file__)
          sql_files = sorted(f for f in os.listdir(mdir) if f.endswith('.sql'))
          assert sql_files, f'no .sql migrations found in installed {mdir}'
          print('migrations found:', sql_files)
          cvi_dir = os.path.dirname(cvi.__file__)
          for gone in ('benchmark_data.py', 'ingest.py', 'benchmark.py'):
              path = os.path.join(cvi_dir, gone)
              assert not os.path.exists(path), f'{gone} should not exist in the installed package'
          print('ALL CHECKS PASSED')
          "
