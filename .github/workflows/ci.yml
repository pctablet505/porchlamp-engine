name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "fastapi==0.141.1" "httpx==0.28.1" "ruff==0.16.7"

      - name: Lint (gate 1, ratchet: must stay clean)
        run: ruff check cvi/ scripts/ tests/

      - name: Run test suite
        run: env -u PYTEST_ADDOPTS python -m pytest tests/ -n auto -p no:cacheprovider

      - name: Anchors, sensitivity, reproduce (fixture snapshot)
        run: >
          env -u PYTEST_ADDOPTS python -m pytest
          tests/audit/test_anchors_fixture.py
          tests/audit/test_sensitivity_fixture.py
          tests/snapshot/test_reproduce_fixture.py
          -p no:cacheprovider

  package:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Show dist output
        run: ls -l dist/
