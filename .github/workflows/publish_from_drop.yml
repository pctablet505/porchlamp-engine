name: Publish Snapshot from Drop-Box

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional specific cycle-* tag from the drop-box repo"
        required: false
        default: ""
        type: string
      snapshot_id:
        description: "Optional snapshot ID override (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      allow_shrink:
        description: "Intentional override for the corpus shrinkage circuit breaker"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-from-drop
  cancel-in-progress: false

jobs:
  publish:
    name: Pull drop-box cycle and publish static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: engine
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore last published drop-box state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: drop-data/state/pulled/release.json
          key: drop-pulled-release-${{ github.run_id }}
          restore-keys: |
            drop-pulled-release-

      - name: Check drop-box for a new finished cycle
        id: check
        env:
          DROP_REPO: ${{ vars.PORCHLAMP_DROP_REPO }}
          DROP_READ_SECRET: ${{ secrets.PORCHLAMP_DROP_READ_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${DROP_REPO}" ] || [ -z "${DROP_READ_SECRET}" ]; then
            echo "Drop-box variables/secrets not configured yet; skipping."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOK_FILE="$(mktemp "${RUNNER_TEMP}/drop-read-check.XXXXXX")"
          chmod 600 "${TOK_FILE}"
          trap 'shred -u "${TOK_FILE}" 2>/dev/null || rm -f "${TOK_FILE}"' EXIT
          printf '%s\n' "${DROP_READ_SECRET}" > "${TOK_FILE}"
          unset DROP_READ_SECRET

          TAG_ARGS=()
          if [ -n "${INPUT_TAG}" ]; then
            if [[ ! "${INPUT_TAG}" =~ ^cycle-([0-9]{4}-[0-9]{2}-[0-9]{2}|cycle)-[0-9a-f]{12}$ ]]; then
              echo "Invalid release_tag input format." >&2
              exit 1
            fi
            TAG_ARGS=(--tag "${INPUT_TAG}")
          fi
          python engine/scripts/pull_from_drop.py \
            --repo "${DROP_REPO}" \
            --dest drop-data \
            --token-file "${TOK_FILE}" \
            --check-only \
            --status-out check-status.json \
            "${TAG_ARGS[@]}"
          HAS_NEW="$(python -c 'import json; print("true" if json.load(open("check-status.json"))["has_new"] else "false")')"
          REL_TAG="$(python -c 'import json; print(json.load(open("check-status.json")).get("tag") or "")')"
          if [ "${HAS_NEW}" = "true" ]; then
            if [[ ! "${REL_TAG}" =~ ^cycle-([0-9]{4}-[0-9]{2}-[0-9]{2}|cycle)-[0-9a-f]{12}$ ]]; then
              echo "Refusing malformed release tag from drop-box." >&2
              exit 1
            fi
          else
            REL_TAG=""
          fi
          printf 'has_new=%s\n' "${HAS_NEW}" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "${REL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Free unused runner SDKs for snapshot scratch space
        if: steps.check.outputs.has_new == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Node 20
        if: steps.check.outputs.has_new == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install snapshot export dependencies
        if: steps.check.outputs.has_new == 'true'
        run: pip install "fastapi==0.141.1" "httpx==0.28.1" "pyyaml==6.0.3" "uvicorn==0.52.4"

      - name: Checkout porchlamp static site repository (unauthenticated read-only)
        if: steps.check.outputs.has_new == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.PORCHLAMP_SITE_REPO || 'pctablet505/porchlamp' }}
          token: ""
          persist-credentials: false
          path: porchlamp-site
          fetch-depth: 1

      - name: Pull and verify cycle archives from drop-box
        id: pull
        if: steps.check.outputs.has_new == 'true'
        env:
          DROP_REPO: ${{ vars.PORCHLAMP_DROP_REPO }}
          DROP_READ_SECRET: ${{ secrets.PORCHLAMP_DROP_READ_TOKEN }}
          REL_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${REL_TAG}" =~ ^cycle-([0-9]{4}-[0-9]{2}-[0-9]{2}|cycle)-[0-9a-f]{12}$ ]]; then
            echo "Refusing malformed release_tag." >&2
            exit 1
          fi
          TOK_FILE="$(mktemp "${RUNNER_TEMP}/drop-read-pull.XXXXXX")"
          chmod 600 "${TOK_FILE}"
          trap 'shred -u "${TOK_FILE}" 2>/dev/null || rm -f "${TOK_FILE}"' EXIT
          printf '%s\n' "${DROP_READ_SECRET}" > "${TOK_FILE}"
          unset DROP_READ_SECRET

          python engine/scripts/pull_from_drop.py \
            --repo "${DROP_REPO}" \
            --dest drop-data \
            --token-file "${TOK_FILE}" \
            --tag "${REL_TAG}" \
            --status-out pull-status.json
          AS_OF="$(python -c 'import json; print(json.load(open("pull-status.json"))["as_of"])')"
          if [[ ! "${AS_OF}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$ ]]; then
            echo "Refusing malformed as_of timestamp." >&2
            exit 1
          fi
          printf 'as_of=%s\n' "${AS_OF}" >> "$GITHUB_OUTPUT"

      - name: Build, verify, and stage static snapshot (zero-secret sandbox)
        id: build
        if: steps.check.outputs.has_new == 'true'
        env:
          AS_OF: ${{ steps.pull.outputs.as_of }}
          INPUT_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
        run: |
          set -euo pipefail
          SNAP_ID="${INPUT_SNAPSHOT_ID}"
          if [ -z "${SNAP_ID}" ]; then
            SNAP_ID="$(date -u +%Y-%m-%d)"
          fi
          if [[ ! "${SNAP_ID}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]{1,16})?$ ]]; then
            echo "Refusing invalid snapshot_id." >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [ "${ALLOW_SHRINK}" = "true" ]; then
            EXTRA_ARGS+=(--allow-shrink)
          fi
          python engine/scripts/publish_snapshot.py \
            --data-dir drop-data \
            --work-dir publish-work \
            --target-site porchlamp-site \
            --snapshot-id "${SNAP_ID}" \
            --as-of "${AS_OF}" \
            --status-out publish-status.json \
            "${EXTRA_ARGS[@]}"
          printf 'snapshot_id=%s\n' "${SNAP_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish staged snapshot to porchlamp repository
        if: steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.PORCHLAMP_SITE_PUSH_TOKEN }}
          SNAP_ID: ${{ steps.build.outputs.snapshot_id }}
          REL_TAG: ${{ steps.check.outputs.release_tag }}
          SITE_REPO: ${{ vars.PORCHLAMP_SITE_REPO || 'pctablet505/porchlamp' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "PORCHLAMP_SITE_PUSH_TOKEN secret is required to publish." >&2
            exit 1
          fi
          if [[ ! "${SNAP_ID}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]{1,16})?$ ]]; then
            echo "Invalid SNAP_ID." >&2
            exit 1
          fi
          if [[ ! "${REL_TAG}" =~ ^cycle-([0-9]{4}-[0-9]{2}-[0-9]{2}|cycle)-[0-9a-f]{12}$ ]]; then
            echo "Invalid REL_TAG." >&2
            exit 1
          fi
          if [[ ! "${SITE_REPO}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid SITE_REPO." >&2
            exit 1
          fi
          if [ -e porchlamp-site/.github ] || [ -n "$(find porchlamp-site -mindepth 1 -not -path 'porchlamp-site/.git*' -type l -print -quit)" ]; then
            echo "Security invariant failed: .github or symlink detected in staged site." >&2
            exit 1
          fi
          git -C porchlamp-site config user.name "pctablet505"
          git -C porchlamp-site config user.email "55033230+pctablet505@users.noreply.github.com"
          if [ -z "$(git -C porchlamp-site status --porcelain)" ]; then
            echo "No site changes to publish."
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          BRANCH="auto/snapshot-${SNAP_ID}"
          git -C porchlamp-site checkout -B "${BRANCH}"
          git -C porchlamp-site add -A
          git -C porchlamp-site commit -m "Publish snapshot ${SNAP_ID} (${REL_TAG})"
          git -C porchlamp-site -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push --force origin "HEAD:refs/heads/${BRANCH}"
          if ! gh pr view "${BRANCH}" --repo "${SITE_REPO}" >/dev/null 2>&1; then
            gh pr create \
              --repo "${SITE_REPO}" \
              --base main \
              --head "${BRANCH}" \
              --title "Publish snapshot ${SNAP_ID}" \
              --body "Automated snapshot build from verified phone cycle \`${REL_TAG}\`. All static parity, mutant, report, chrome, project, home, crawl, and shrinkage checks passed."
          fi

      - name: Save published drop-box state cache
        if: steps.check.outputs.has_new == 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: drop-data/state/pulled/release.json
          key: drop-pulled-release-${{ steps.check.outputs.release_tag }}-${{ github.run_id }}
