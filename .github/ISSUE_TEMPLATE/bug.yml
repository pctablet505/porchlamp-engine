name: Bug
description: Something on porchlamp.org or in the engine does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The page address or the command you ran, and what you saw. Paste error output as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and system, or Python version
      placeholder: Firefox on Android, or Python 3.12 on Ubuntu 24.04
