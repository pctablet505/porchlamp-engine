        <rect x="15" y="16" width="60" height="42" rx="4" fill="#10B981" fill-opacity="0.15"/>
        <text x="26" y="42" fill="#10B981" font-family="monospace" font-size="18" font-weight="900">▲ +8</text>

        <text x="90" y="32" fill="#F8FAFC" font-size="15" font-weight="700">duckdb / duckdb</text>
        <text x="90" y="52" fill="#94A3B8" font-size="11">Fast Human Review · TTFHR: 14.1h · Welcoming Core Team</text>

        <text x="470" y="35" fill="#10B981" font-family="monospace" font-size="18" font-weight="700">93.8</text>
        <text x="470" y="52" fill="#64748B" font-size="10">Rank #002</text>
      </g>

      <!-- Re-Ranked Item 3: fastapi/tiangolo (Dropped -4) -->
      <g transform="translate(24, 255)">
        <rect x="0" y="0" width="550" height="75" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <rect x="15" y="16" width="60" height="42" rx="4" fill="#EF4444" fill-opacity="0.15"/>
        <text x="26" y="42" fill="#EF4444" font-family="monospace" font-size="18" font-weight="900">▼ -4</text>

        <text x="90" y="32" fill="#F8FAFC" font-size="15" font-weight="700">fastapi / tiangolo</text>
        <text x="90" y="52" fill="#94A3B8" font-size="11">High Download Footprint, but Review Backlog is Dense</text>

        <text x="470" y="35" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="700">82.1</text>
        <text x="470" y="52" fill="#64748B" font-size="10">Rank #007</text>
      </g>

      <!-- Share Configuration URL Box -->
      <g transform="translate(24, 430)">
        <rect x="0" y="0" width="550" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#94A3B8" font-size="11" font-weight="600">SERIALIZED URL PARAMETERS (SHARE YOUR CRITERIA):</text>
        <rect x="15" y="32" width="440" height="20" rx="4" fill="#0F172A"/>
        <text x="22" y="46" fill="#38BDF8" font-family="monospace" font-size="10">https://cvi.dev/leaderboard?w_resp=35&amp;w_crit=10&amp;w_gov=15&amp;w_rig=10&amp;w_acc=30</text>
        <rect x="465" y="32" width="70" height="20" rx="4" fill="#10B981"/>
        <text x="480" y="46" fill="#090D16" font-size="10" font-weight="700">Copy URL</text>
